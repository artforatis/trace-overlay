                  if (p < 0) return null;
                  File f = new File(getFilesDir(), "page_" + p + "_color.png");
                  return f.exists() ? f : null;
              }

              String currentImage() {
                  File f = currentFile();
                  if (f == null) return null;
                  BitmapFactory.Options o = new BitmapFactory.Options();
                  o.inJustDecodeBounds = true;
                  BitmapFactory.decodeFile(f.getAbsolutePath(), o);
                  int s = 1;
                  while (Math.max(o.outWidth, o.outHeight) / s > 1024) s *= 2;
                  BitmapFactory.Options o2 = new BitmapFactory.Options();
                  o2.inSampleSize = s;
                  Bitmap b = BitmapFactory.decodeFile(f.getAbsolutePath(), o2);
                  if (b == null) return null;
                  Bitmap out = Bitmap.createBitmap(b.getWidth(), b.getHeight(), Bitmap.Config.ARGB_8888);
                  Canvas cv = new Canvas(out);
                  cv.drawColor(Color.WHITE);
                  cv.drawBitmap(b, 0, 0, null);
                  ByteArrayOutputStream bo = new ByteArrayOutputStream();
                  out.compress(Bitmap.CompressFormat.JPEG, 85, bo);
                  return Base64.encodeToString(bo.toByteArray(), Base64.NO_WRAP);
              }

