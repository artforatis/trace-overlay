              String ask(int prov, String key, String model, String baseUrl, List<String[]> hist, String img) throws Exception {
                  List<String[]> h = new ArrayList<>(hist.subList(Math.max(0, hist.size() - 12), hist.size()));
                  while (!h.isEmpty() && !h.get(0)[0].equals("user")) h.remove(0);
                  int last = h.size() - 1;
                  if (prov == 0) {
                      JSONArray contents = new JSONArray();
                      for (int i = 0; i < h.size(); i++) {
                          JSONArray parts = new JSONArray();
                          parts.put(new JSONObject().put("text", h.get(i)[1]));
                          if (i == last && img != null) {
                              parts.put(new JSONObject().put("inline_data",
                                      new JSONObject().put("mime_type", "image/jpeg").put("data", img)));
                          }
                          contents.put(new JSONObject()
                                  .put("role", h.get(i)[0].equals("user") ? "user" : "model")
                                  .put("parts", parts));
