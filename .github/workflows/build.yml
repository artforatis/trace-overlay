name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Create project
        run: |
          mkdir -p app/src/main/java/com/trace/overlay
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "TraceOverlay"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3072m
          android.useAndroidX=true
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.trace.overlay'
              compileSdk 34
              defaultConfig {
                  applicationId "com.trace.overlay"
                  minSdk 30
                  targetSdk 34
                  versionCode 3
                  versionName "3.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1'
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.INTERNET"/>
              <queries>
                  <intent><action android:name="android.intent.action.TTS_SERVICE"/></intent>
                  <intent><action android:name="android.speech.action.RECOGNIZE_SPEECH"/></intent>
              </queries>
              <application
                  android:label="Trace Overlay"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:allowBackup="false"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <meta-data
                      android:name="com.google.mlkit.vision.DEPENDENCIES"
                      android:value="subject_segment"/>
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <activity
                      android:name=".AssistantActivity"
                      android:exported="false"
                      android:theme="@android:style/Theme.Material.Dialog.NoActionBar"
                      android:taskAffinity="com.trace.overlay.ai"
                      android:launchMode="singleTask"
                      android:windowSoftInputMode="adjustResize"/>
                  <service
                      android:name=".OverlayService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Floating tracing reference image"/>
                  </service>
                  <service
                      android:name=".DrawService"
                      android:exported="true"
                      android:label="Trace Overlay ম্যাগনেট কলম"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/draw_service"/>
                  </service>
              </application>
          </manifest>
          EOF
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="acc_desc">ম্যাগনেট কলম: আপনার আঁকা রেখাকে কালো আউটলাইনের উপর বসিয়ে আর্ট অ্যাপে এঁকে দেয়। এটি স্ক্রিনের কোনো লেখা বা তথ্য পড়ে না।</string>
          </resources>
          EOF
          cat > app/src/main/res/xml/draw_service.xml <<'EOF'
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/acc_desc"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="false"
              android:notificationTimeout="100"/>
          EOF
          cat > app/src/main/res/drawable/ic_bg.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <gradient android:angle="135" android:startColor="#7B5CFF" android:endColor="#FF4D9D"/>
          </shape>
          EOF
          cat > app/src/main/res/drawable/ic_fg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:strokeColor="#99FFFFFF" android:strokeWidth="3.5" android:fillColor="#00000000"
                  android:pathData="M36,30 H62 A4,4 0 0 1 66,34 V60 A4,4 0 0 1 62,64 H36 A4,4 0 0 1 32,60 V34 A4,4 0 0 1 36,30 Z"/>
              <path android:strokeColor="#FFFFFFFF" android:strokeWidth="3.5" android:fillColor="#33FFFFFF"
                  android:pathData="M46,40 H72 A4,4 0 0 1 76,44 V70 A4,4 0 0 1 72,74 H46 A4,4 0 0 1 42,70 V44 A4,4 0 0 1 46,40 Z"/>
              <path android:fillColor="#FFFFFFFF" android:pathData="M50,70 L57,60 L62,65 L67,58 L73,70 Z"/>
              <path android:fillColor="#FFC107" android:strokeColor="#40000000" android:strokeWidth="1"
                  android:pathData="M42.83,69.51 L61.21,51.13 L66.87,56.79 L48.49,75.17 Z"/>
              <path android:fillColor="#FF8A80" android:strokeColor="#40000000" android:strokeWidth="1"
                  android:pathData="M61.21,51.13 L65.45,46.89 L71.11,52.55 L66.87,56.79 Z"/>
              <path android:fillColor="#FFE0B2" android:pathData="M40,78 L42.83,69.51 L48.49,75.17 Z"/>
              <path android:fillColor="#333333" android:pathData="M40,78 L41.4,73.8 L44.2,76.6 Z"/>
          </vector>
          EOF
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_bg"/>
              <foreground android:drawable="@drawable/ic_fg"/>
          </adaptive-icon>
          EOF
          cat > app/src/main/java/com/trace/overlay/ImageTools.java <<'EOF'
          package com.trace.overlay;

          import android.graphics.Bitmap;
          import android.graphics.drawable.GradientDrawable;

          final class ImageTools {
              static GradientDrawable round(int color, float r) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(color);
                  g.setCornerRadius(r);
                  return g;
              }

              static Bitmap lineArt(Bitmap src) {
                  int w = src.getWidth(), h = src.getHeight();
                  int[] px = new int[w * h];
                  src.getPixels(px, 0, w, 0, 0, w, h);
                  for (int i = 0; i < px.length; i++) {
                      int c = px[i];
                      int a = c >>> 24;
                      int r = (c >> 16) & 255, g = (c >> 8) & 255, b = c & 255;
                      int lum = (r * 299 + g * 587 + b * 114) / 1000;
                      if (a < 100 || lum >= 140) {
                          px[i] = 0;
                      } else {
                          int al = lum <= 60 ? 255 : (255 * (140 - lum)) / 80;
                          al = al * a / 255;
                          px[i] = al << 24;
                      }
                  }
                  return Bitmap.createBitmap(px, w, h, Bitmap.Config.ARGB_8888);
              }

              static Bitmap removeBackground(Bitmap src) {
                  int w = src.getWidth(), h = src.getHeight();
                  int[] px = new int[w * h];
                  src.getPixels(px, 0, w, 0, 0, w, h);
                  long sr = 0, sg = 0, sb = 0;
                  int n = 0;
                  for (int x = 0; x < w; x++) {
                      int c1 = px[x], c2 = px[(h - 1) * w + x];
                      sr += ((c1 >> 16) & 255) + ((c2 >> 16) & 255);
                      sg += ((c1 >> 8) & 255) + ((c2 >> 8) & 255);
                      sb += (c1 & 255) + (c2 & 255);
                      n += 2;
                  }
                  for (int y = 0; y < h; y++) {
                      int c1 = px[y * w], c2 = px[y * w + w - 1];
                      sr += ((c1 >> 16) & 255) + ((c2 >> 16) & 255);
                      sg += ((c1 >> 8) & 255) + ((c2 >> 8) & 255);
                      sb += (c1 & 255) + (c2 & 255);
                      n += 2;
                  }
                  int br = (int) (sr / n), bgc = (int) (sg / n), bb = (int) (sb / n);
                  int tol2 = 55 * 55;
                  boolean[] seen = new boolean[w * h];
                  int[] q = new int[w * h];
                  int head = 0, tail = 0;
                  for (int x = 0; x < w; x++) {
                      tail = push(x, px, seen, q, tail, br, bgc, bb, tol2);
                      tail = push((h - 1) * w + x, px, seen, q, tail, br, bgc, bb, tol2);
                  }
                  for (int y = 0; y < h; y++) {
                      tail = push(y * w, px, seen, q, tail, br, bgc, bb, tol2);
                      tail = push(y * w + w - 1, px, seen, q, tail, br, bgc, bb, tol2);
                  }
                  while (head < tail) {
                      int i = q[head++];
                      int x = i % w, y = i / w;
                      if (x > 0) tail = push(i - 1, px, seen, q, tail, br, bgc, bb, tol2);
                      if (x < w - 1) tail = push(i + 1, px, seen, q, tail, br, bgc, bb, tol2);
                      if (y > 0) tail = push(i - w, px, seen, q, tail, br, bgc, bb, tol2);
                      if (y < h - 1) tail = push(i + w, px, seen, q, tail, br, bgc, bb, tol2);
                  }
                  for (int i = 0; i < px.length; i++) if (seen[i]) px[i] = 0;
                  return Bitmap.createBitmap(px, w, h, Bitmap.Config.ARGB_8888);
              }

              private static int push(int j, int[] px, boolean[] seen, int[] q, int tail,
                                      int br, int bgc, int bb, int tol2) {
                  if (seen[j]) return tail;
                  int c = px[j];
                  boolean near;
                  if ((c >>> 24) < 30) {
                      near = true;
                  } else {
                      int dr = ((c >> 16) & 255) - br, dg = ((c >> 8) & 255) - bgc, db = (c & 255) - bb;
                      near = dr * dr + dg * dg + db * db < tol2;
                  }
                  if (near) {
                      seen[j] = true;
                      q[tail++] = j;
                  }
                  return tail;
              }
          }
          EOF
          cat > app/src/main/java/com/trace/overlay/DrawService.java <<'EOF'
          package com.trace.overlay;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;
          import android.content.Intent;
          import android.graphics.Path;
          import android.view.accessibility.AccessibilityEvent;
          import java.util.List;

          // Only performs drawing gestures. Reads nothing from the screen.
          public class DrawService extends AccessibilityService {
              static DrawService instance;

              @Override
              protected void onServiceConnected() {
                  super.onServiceConnected();
                  instance = this;
              }

              @Override
              public boolean onUnbind(Intent i) {
                  instance = null;
                  return super.onUnbind(i);
              }

              @Override
              public void onDestroy() {
                  instance = null;
                  super.onDestroy();
              }

              @Override public void onAccessibilityEvent(AccessibilityEvent e) { }
              @Override public void onInterrupt() { }

              void play(List<Path> paths, List<Long> durs, int i, Runnable done) {
                  if (i >= paths.size()) { done.run(); return; }
                  GestureDescription g = new GestureDescription.Builder()
                          .addStroke(new GestureDescription.StrokeDescription(paths.get(i), 0, durs.get(i)))
                          .build();
                  boolean ok = dispatchGesture(g, new GestureResultCallback() {
                      @Override public void onCompleted(GestureDescription d) { play(paths, durs, i + 1, done); }
                      @Override public void onCancelled(GestureDescription d) { done.run(); }
                  }, null);
                  if (!ok) done.run();
              }
          }
          EOF
          cat > app/src/main/java/com/trace/overlay/MainActivity.java <<'EOF'
          package com.trace.overlay;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.ImageDecoder;
          import android.graphics.Paint;
          import android.graphics.Shader;
          import android.graphics.Typeface;
          import android.graphics.drawable.BitmapDrawable;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.Switch;
          import android.widget.TextView;
          import android.widget.Toast;
          import com.google.mlkit.vision.common.InputImage;
          import com.google.mlkit.vision.segmentation.subject.SubjectSegmentation;
          import com.google.mlkit.vision.segmentation.subject.SubjectSegmenter;
          import com.google.mlkit.vision.segmentation.subject.SubjectSegmenterOptions;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.concurrent.CountDownLatch;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import java.util.concurrent.TimeUnit;

          public class MainActivity extends Activity {
              static final int PICK = 1;
              static final int BG = 0xFF121218, CARD = 0xFF1E1E2A, ACCENT = 0xFF7B5CFF;
              float d;
              ImageView preview;
              TextView statusTv, emptyTv, pageLbl;
              LinearLayout navRow;
              Switch swBg, swLine;
              Button permBtn, startBtn, accBtn;
              Bitmap original, processed;
              final List<Uri> pages = new ArrayList<>();
              int cur = 0, generation = 0;
              final ExecutorService exec = Executors.newSingleThreadExecutor();

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  if (Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"}, 2);
                  }
                  d = getResources().getDisplayMetrics().density;
                  getWindow().setStatusBarColor(BG);
                  getWindow().setNavigationBarColor(BG);

                  ScrollView sv = new ScrollView(this);
                  sv.setBackgroundColor(BG);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(20), dp(20), dp(20), dp(40));
                  sv.addView(root);

                  LinearLayout header = new LinearLayout(this);
                  header.setOrientation(LinearLayout.VERTICAL);
                  GradientDrawable hg = new GradientDrawable(GradientDrawable.Orientation.TL_BR,
                          new int[]{0xFF7B5CFF, 0xFFFF4D9D});
                  hg.setCornerRadius(dp(22));
                  header.setBackground(hg);
                  header.setPadding(dp(24), dp(28), dp(24), dp(28));
                  header.addView(text("✏  Trace Overlay", 30, Color.WHITE, true));
                  header.addView(text("যেকোনো আর্ট অ্যাপের উপরে ছবি রেখে সহজে ট্রেস করুন", 15, 0xE6FFFFFF, false));
                  root.addView(header);

                  permBtn = button("", 0xFFFF9800);
                  permBtn.setOnClickListener(v -> {
                      if (Settings.canDrawOverlays(this)) {
                          toast("অনুমতি আগেই দেওয়া আছে ✅");
                      } else {
                          startActivity(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                  Uri.parse("package:" + getPackageName())));
                      }
                  });
                  root.addView(card("ধাপ ১ · অনুমতি", permBtn));

                  Button pickBtn = button("🖼  ছবি বাছাই করুন (একাধিক দেওয়া যাবে)", ACCENT);
                  pickBtn.setOnClickListener(v -> {
                      Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                      i.addCategory(Intent.CATEGORY_OPENABLE);
                      i.setType("image/*");
                      i.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                      startActivityForResult(i, PICK);
                  });

                  FrameLayout box = new FrameLayout(this);
                  box.setBackground(checker());
                  preview = new ImageView(this);
                  preview.setScaleType(ImageView.ScaleType.FIT_CENTER);
                  box.addView(preview, new FrameLayout.LayoutParams(-1, -1));
                  emptyTv = text("এখনো কোনো ছবি বাছাই করা হয়নি", 15, 0xFF9090A8, false);
                  emptyTv.setGravity(Gravity.CENTER);
                  box.addView(emptyTv, new FrameLayout.LayoutParams(-1, -1));
                  box.setLayoutParams(new LinearLayout.LayoutParams(-1, dp(280)));

                  navRow = new LinearLayout(this);
                  navRow.setOrientation(LinearLayout.HORIZONTAL);
                  navRow.setGravity(Gravity.CENTER_VERTICAL);
                  Button prevB = button("◀", 0xFF3A3A4A);
                  prevB.setOnClickListener(v -> { if (cur > 0) { cur--; loadPreview(); } });
                  pageLbl = text("", 16, Color.WHITE, true);
                  pageLbl.setGravity(Gravity.CENTER);
                  Button nextB = button("▶", 0xFF3A3A4A);
                  nextB.setOnClickListener(v -> { if (cur < pages.size() - 1) { cur++; loadPreview(); } });
                  navRow.addView(prevB, new LinearLayout.LayoutParams(0, -2, 1f));
                  navRow.addView(pageLbl, new LinearLayout.LayoutParams(0, -2, 1f));
                  navRow.addView(nextB, new LinearLayout.LayoutParams(0, -2, 1f));
                  navRow.setVisibility(View.GONE);

                  swBg = toggle("✂  ব্যাকগ্রাউন্ড মুছে ফেলুন");
                  swLine = toggle("🖊  শুধু কালো আউটলাইন রাখুন");
                  swBg.setOnCheckedChangeListener((s, c) -> {
                      if (c) swLine.setChecked(false);
                      reprocess();
                  });
                  swLine.setOnCheckedChangeListener((s, c) -> {
                      if (c) swBg.setChecked(false);
                      reprocess();
                  });
                  statusTv = text("", 15, 0xFFB0B0C8, false);
                  root.addView(card("ধাপ ২ · ছবি", pickBtn, box, navRow, swBg, swLine, statusTv));

                  startBtn = button("▶  ট্রেসিং শুরু করুন", 0xFF00C853);
                  startBtn.setOnClickListener(v -> startOverlay());
                  Button stopBtn = button("■  বন্ধ করুন", 0xFF3A3A4A);
                  stopBtn.setOnClickListener(v -> {
                      stopService(new Intent(this, OverlayService.class));
                      toast("বন্ধ করা হয়েছে");
                  });
                  root.addView(card("ধাপ ৩ · শুরু", startBtn, stopBtn));

                  accBtn = button("", 0xFFFF9800);
                  accBtn.setOnClickListener(v -> {
                      try { startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)); } catch (Exception ignored) { }
                      toast("\"Trace Overlay ম্যাগনেট কলম\" খুঁজে চালু করুন");
                  });
                  root.addView(card("🧲 ম্যাগনেট কলম",
                          text("চালু থাকলে কালো লাইনের কাছ দিয়ে আঁকলে আঁকাটা নিজে থেকে লাইনের উপর বসে যায়।", 14, 0xFFB0B0C8, false),
                          accBtn));

                  Button aiBtn = button("🤖  AI সহকারী খুলুন", ACCENT);
                  aiBtn.setOnClickListener(v -> startActivity(new Intent(this, AssistantActivity.class)));
                  root.addView(card("🤖 AI আর্ট সহকারী", aiBtn));

                  root.addView(card("টিপস", text(
                          "• 🔓 সবুজ = ছবি সাজানোর মোড\n"
                          + "• 🔒 লাল = আঁকার মোড\n"
                          + "• 🎨 / ⚫ বাটনে রঙিন আর আউটলাইন বদলান\n"
                          + "• ◀ ▶ দিয়ে পাতা বদলান\n"
                          + "• ভিডিওর জন্য আর্ট অ্যাপের টাইমল্যাপস ব্যবহার করুন",
                          14, 0xFFB0B0C8, false)));

                  setContentView(sv);
                  updateUi();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  updateUi();
              }

              @Override
              protected void onDestroy() {
                  exec.shutdown();
                  super.onDestroy();
              }

              void updateUi() {
                  boolean ok = Settings.canDrawOverlays(this);
                  permBtn.setText(ok ? "✅  অনুমতি দেওয়া আছে" : "🔑  অনুমতি দিন");
                  permBtn.setBackground(ImageTools.round(ok ? 0xFF2E7D32 : 0xFFFF9800, dp(14)));
                  boolean acc = DrawService.instance != null;
                  accBtn.setText(acc ? "✅  ম্যাগনেট কলম চালু আছে" : "⚙  Accessibility-তে চালু করুন");
                  accBtn.setBackground(ImageTools.round(acc ? 0xFF2E7D32 : 0xFFFF9800, dp(14)));
                  boolean ready = ok && processed != null && !pages.isEmpty();
                  startBtn.setEnabled(ready);
                  startBtn.setAlpha(ready ? 1f : 0.4f);
              }

              @Override
              protected void onActivityResult(int rq, int rs, Intent data) {
                  super.onActivityResult(rq, rs, data);
                  if (rq != PICK || rs != RESULT_OK || data == null) return;
                  List<Uri> got = new ArrayList<>();
                  ClipData cd = data.getClipData();
                  if (cd != null) {
                      for (int i = 0; i < cd.getItemCount(); i++) got.add(cd.getItemAt(i).getUri());
                  } else if (data.getData() != null) {
                      got.add(data.getData());
                  }
                  if (got.isEmpty()) return;
                  for (Uri u : got) {
                      try {
                          getContentResolver().takePersistableUriPermission(u, Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      } catch (Exception ignored) { }
                  }
                  pages.clear();
                  pages.addAll(got);
                  cur = 0;
                  loadPreview();
              }

              void loadPreview() {
                  if (pages.isEmpty()) return;
                  pageLbl.setText("পাতা " + (cur + 1) + " / " + pages.size());
                  navRow.setVisibility(pages.size() > 1 ? View.VISIBLE : View.GONE);
                  final Uri u = pages.get(cur);
                  final int gen = ++generation;
                  processed = null;
                  updateUi();
                  status("⏳ ছবি খোলা হচ্ছে...");
                  exec.execute(() -> {
                      try {
                          Bitmap b = decode(u);
                          runOnUiThread(() -> {
                              if (gen != generation) return;
                              original = b;
                              reprocess();
                          });
                      } catch (Exception e) {
                          runOnUiThread(() -> status("❌ ছবিটি খোলা যায়নি"));
                      }
                  });
              }

              Bitmap decode(Uri uri) throws Exception {
                  Bitmap b = ImageDecoder.decodeBitmap(
                          ImageDecoder.createSource(getContentResolver(), uri),
                          (dec, info, src) -> {
                              dec.setAllocator(ImageDecoder.ALLOCATOR_SOFTWARE);
                              int w = info.getSize().getWidth(), h = info.getSize().getHeight();
                              float s = Math.min(1f, 2000f / Math.max(w, h));
                              dec.setTargetSize(Math.max(1, Math.round(w * s)), Math.max(1, Math.round(h * s)));
                          });
                  if (b.getConfig() != Bitmap.Config.ARGB_8888) b = b.copy(Bitmap.Config.ARGB_8888, false);
                  return b;
              }

              Bitmap bgSync(Bitmap src) {
                  try {
                      SubjectSegmenter seg = SubjectSegmentation.getClient(
                              new SubjectSegmenterOptions.Builder().enableForegroundBitmap().build());
                      final Bitmap[] out = new Bitmap[1];
                      final CountDownLatch latch = new CountDownLatch(1);
                      seg.process(InputImage.fromBitmap(src, 0))
                              .addOnSuccessListener(r -> { out[0] = r.getForegroundBitmap(); latch.countDown(); })
                              .addOnFailureListener(e -> latch.countDown());
                      latch.await(40, TimeUnit.SECONDS);
                      if (out[0] != null) return out[0];
                  } catch (Throwable ignored) { }
                  return ImageTools.removeBackground(src);
              }

              void reprocess() {
                  if (original == null) return;
                  final int gen = ++generation;
                  final Bitmap src = original;
                  final boolean line = swLine.isChecked(), bg = swBg.isChecked();
                  processed = null;
                  updateUi();
                  if (line) status("⏳ আউটলাইন আলাদা করা হচ্ছে...");
                  else if (bg) status("⏳ ব্যাকগ্রাউন্ড মোছা হচ্ছে...");
                  exec.execute(() -> {
                      Bitmap r = line ? ImageTools.lineArt(src) : bg ? bgSync(src) : src;
                      done(gen, r, line ? "✅ শুধু কালো আউটলাইন রাখা হয়েছে"
                              : bg ? "✅ ব্যাকগ্রাউন্ড মোছা হয়েছে" : "✅ ছবি প্রস্তুত");
                  });
              }

              void done(int gen, Bitmap b, String msg) {
                  runOnUiThread(() -> {
                      if (gen != generation) return;
                      processed = b;
                      preview.setImageBitmap(b);
                      emptyTv.setVisibility(View.GONE);
                      status(msg);
                      updateUi();
                  });
              }

              void save(Bitmap b, File f) throws Exception {
                  try (FileOutputStream o = new FileOutputStream(f)) {
                      b.compress(Bitmap.CompressFormat.PNG, 100, o);
                  }
              }

              void startOverlay() {
                  if (pages.isEmpty()) return;
                  if (!Settings.canDrawOverlays(this)) {
                      toast("আগে অনুমতি দিন");
                      return;
                  }
                  final List<Uri> list = new ArrayList<>(pages);
                  final boolean bg = swBg.isChecked(), line = swLine.isChecked();
                  startBtn.setEnabled(false);
                  exec.execute(() -> {
                      try {
                          File dir = getFilesDir();
                          for (int i = 0; i < list.size(); i++) {
                              final int n = i + 1;
                              runOnUiThread(() -> status("⏳ পাতা " + n + "/" + list.size() + " প্রস্তুত হচ্ছে..."));
                              Bitmap o = decode(list.get(i));
                              Bitmap color = bg ? bgSync(o) : o;
                              Bitmap ln = ImageTools.lineArt(o);
                              save(color, new File(dir, "page_" + i + "_color.png"));
                              save(ln, new File(dir, "page_" + i + "_line.png"));
                          }
                          runOnUiThread(() -> {
                              Intent s = new Intent(this, OverlayService.class);
                              s.putExtra("count", list.size());
                              s.putExtra("line", line);
                              startForegroundService(s);
                              status("✅ চালু হয়েছে — এখন আর্ট অ্যাপ খুলুন");
                              updateUi();
                              moveTaskToBack(true);
                          });
                      } catch (Exception e) {
                          runOnUiThread(() -> {
                              status("❌ চালু করা যায়নি");
                              updateUi();
                          });
                      }
                  });
              }

              int dp(float v) { return Math.round(v * d); }

              void status(String s) { statusTv.setText(s); }

              void toast(String s) { Toast.makeText(this, s, Toast.LENGTH_SHORT).show(); }

              TextView text(String s, float size, int color, boolean bold) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(size);
                  t.setTextColor(color);
