          cat > app/src/main/java/com/trace/overlay/ImageTools.java <<'EOF'
          package com.trace.overlay;

          import android.graphics.Bitmap;
          import android.graphics.drawable.GradientDrawable;

          final class ImageTools {
              static GradientDrawable round(int color, float r) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(color);
                  g.setCornerRadius(r);
                  return g;
              }

              static Bitmap lineArt(Bitmap src) {
                  int w = src.getWidth(), h = src.getHeight();
                  int[] px = new int[w * h];
                  src.getPixels(px, 0, w, 0, 0, w, h);
                  for (int i = 0; i < px.length; i++) {
                      int c = px[i];
                      int a = c >>> 24;
                      int r = (c >> 16) & 255, g = (c >> 8) & 255, b = c & 255;
                      int lum = (r * 299 + g * 587 + b * 114) / 1000;
                      if (a < 100 || lum >= 140) {
                          px[i] = 0;
                      } else {
                          int al = lum <= 60 ? 255 : (255 * (140 - lum)) / 80;
                          al = al * a / 255;
                          px[i] = al << 24;
                      }
                  }
                  return Bitmap.createBitmap(px, w, h, Bitmap.Config.ARGB_8888);
              }

              // Thins thick outlines down to a 1-pixel centre line (Zhang-Suen)
              static boolean[] skeleton(boolean[] src, int w, int h) {
                  byte[] a = new byte[w * h];
                  for (int y = 1; y < h - 1; y++) {
                      for (int x = 1; x < w - 1; x++) {
                          int i = y * w + x;
                          a[i] = (byte) (src[i] ? 1 : 0);
                      }
                  }
                  int[] del = new int[w * h];
                  boolean changed = true;
                  int iter = 0;
                  while (changed && iter++ < 150) {
                      changed = false;
                      for (int step = 0; step < 2; step++) {
                          int n = 0;
                          for (int y = 1; y < h - 1; y++) {
                              int row = y * w;
                              for (int x = 1; x < w - 1; x++) {
                                  int i = row + x;
                                  if (a[i] == 0) continue;
                                  int p2 = a[i - w], p3 = a[i - w + 1], p4 = a[i + 1], p5 = a[i + w + 1];
                                  int p6 = a[i + w], p7 = a[i + w - 1], p8 = a[i - 1], p9 = a[i - w - 1];
                                  int bs = p2 + p3 + p4 + p5 + p6 + p7 + p8 + p9;
                                  if (bs < 2 || bs > 6) continue;
                                  int t = 0;
                                  if (p2 == 0 && p3 == 1) t++;
                                  if (p3 == 0 && p4 == 1) t++;
                                  if (p4 == 0 && p5 == 1) t++;
                                  if (p5 == 0 && p6 == 1) t++;
                                  if (p6 == 0 && p7 == 1) t++;
                                  if (p7 == 0 && p8 == 1) t++;
                                  if (p8 == 0 && p9 == 1) t++;
                                  if (p9 == 0 && p2 == 1) t++;
                                  if (t != 1) continue;
                                  if (step == 0) {
                                      if (p2 * p4 * p6 != 0 || p4 * p6 * p8 != 0) continue;
                                  } else {
                                      if (p2 * p4 * p8 != 0 || p2 * p6 * p8 != 0) continue;
                                  }
                                  del[n++] = i;
                              }
                          }
                          for (int k = 0; k < n; k++) a[del[k]] = 0;
                          if (n > 0) changed = true;
                      }
                  }
                  boolean[] out = new boolean[w * h];
                  for (int i = 0; i < out.length; i++) out[i] = a[i] != 0;
                  return out;
              }

              static Bitmap removeBackground(Bitmap src) {
                  int w = src.getWidth(), h = src.getHeight();
                  int[] px = new int[w * h];
                  src.getPixels(px, 0, w, 0, 0, w, h);
                  long sr = 0, sg = 0, sb = 0;
                  int n = 0;
                  for (int x = 0; x < w; x++) {
                      int c1 = px[x], c2 = px[(h - 1) * w + x];
                      sr += ((c1 >> 16) & 255) + ((c2 >> 16) & 255);
                      sg += ((c1 >> 8) & 255) + ((c2 >> 8) & 255);
                      sb += (c1 & 255) + (c2 & 255);
                      n += 2;
                  }
                  for (int y = 0; y < h; y++) {
                      int c1 = px[y * w], c2 = px[y * w + w - 1];
                      sr += ((c1 >> 16) & 255) + ((c2 >> 16) & 255);
                      sg += ((c1 >> 8) & 255) + ((c2 >> 8) & 255);
                      sb += (c1 & 255) + (c2 & 255);
                      n += 2;
                  }
                  int br = (int) (sr / n), bgc = (int) (sg / n), bb = (int) (sb / n);
                  int tol2 = 55 * 55;
                  boolean[] seen = new boolean[w * h];
                  int[] q = new int[w * h];
                  int head = 0, tail = 0;
                  for (int x = 0; x < w; x++) {
                      tail = push(x, px, seen, q, tail, br, bgc, bb, tol2);
                      tail = push((h - 1) * w + x, px, seen, q, tail, br, bgc, bb, tol2);
                  }
                  for (int y = 0; y < h; y++) {
                      tail = push(y * w, px, seen, q, tail, br, bgc, bb, tol2);
                      tail = push(y * w + w - 1, px, seen, q, tail, br, bgc, bb, tol2);
                  }
                  while (head < tail) {
                      int i = q[head++];
                      int x = i % w, y = i / w;
                      if (x > 0) tail = push(i - 1, px, seen, q, tail, br, bgc, bb, tol2);
                      if (x < w - 1) tail = push(i + 1, px, seen, q, tail, br, bgc, bb, tol2);
                      if (y > 0) tail = push(i - w, px, seen, q, tail, br, bgc, bb, tol2);
                      if (y < h - 1) tail = push(i + w, px, seen, q, tail, br, bgc, bb, tol2);
                  }
                  for (int i = 0; i < px.length; i++) if (seen[i]) px[i] = 0;
                  return Bitmap.createBitmap(px, w, h, Bitmap.Config.ARGB_8888);
              }

              private static int push(int j, int[] px, boolean[] seen, int[] q, int tail,
                                      int br, int bgc, int bb, int tol2) {
                  if (seen[j]) return tail;
                  int c = px[j];
                  boolean near;
                  if ((c >>> 24) < 30) {
                      near = true;
                  } else {
                      int dr = ((c >> 16) & 255) - br, dg = ((c >> 8) & 255) - bgc, db = (c & 255) - bb;
                      near = dr * dr + dg * dg + db * db < tol2;
                  }
                  if (near) {
                      seen[j] = true;
                      q[tail++] = j;
                  }
                  return tail;
              }
          }
          EOF
          cat > app/src/main/java/com/trace/overlay/Palette.java <<'EOF'
          package com.trace.overlay;

          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.Locale;

          final class Palette {
              static final String[] THEME_NAMES = {
                  "🌸 পেস্টেল", "🌅 সূর্যাস্ত", "🌊 সমুদ্র", "🌳 বন",
                  "💜 নিয়ন", "🙂 স্কিন টোন", "📺 রেট্রো", "🖤 মনোক্রোম"
              };
              static final int[][] THEMES = {
                  {0xFFFFB3BA, 0xFFFFDFBA, 0xFFFFFFBA, 0xFFBAFFC9, 0xFFBAE1FF, 0xFFE0BBE4},
                  {0xFFFF6B6B, 0xFFFF8E53, 0xFFFFC857, 0xFFF9A1BC, 0xFF6A4C93, 0xFF2E294E},
                  {0xFF03045E, 0xFF0077B6, 0xFF00B4D8, 0xFF90E0EF, 0xFFCAF0F8, 0xFFF1FAEE},
                  {0xFF2D6A4F, 0xFF40916C, 0xFF74C69D, 0xFFB7E4C7, 0xFF8B5E34, 0xFFDDA15E},
                  {0xFFFF00E5, 0xFF7B2FFF, 0xFF00F0FF, 0xFF39FF14, 0xFFFFE600, 0xFFFF3131},
                  {0xFFFFE0CC, 0xFFF5C6A5, 0xFFE0A67E, 0xFFC68642, 0xFF8D5524, 0xFF5C3317},
                  {0xFFE63946, 0xFFF1FAEE, 0xFFA8DADC, 0xFF457B9D, 0xFF1D3557, 0xFFF4A261},
                  {0xFF000000, 0xFF3A3A3A, 0xFF7A7A7A, 0xFFB5B5B5, 0xFFE0E0E0, 0xFFFFFFFF}
              };

              static List<Integer> load(Context c) {
                  String s = c.getSharedPreferences("palette", Context.MODE_PRIVATE).getString("colors", "");
                  List<Integer> l = new ArrayList<>();
                  if (s.isEmpty()) return l;
                  for (String t : s.split(",")) {
                      try { l.add((int) Long.parseLong(t, 16)); } catch (Exception ignored) { }
                  }
                  return l;
              }

              static void save(Context c, List<Integer> l) {
                  StringBuilder sb = new StringBuilder();
                  for (int x : l) {
                      if (sb.length() > 0) sb.append(',');
                      sb.append(Integer.toHexString(x));
                  }
                  c.getSharedPreferences("palette", Context.MODE_PRIVATE).edit().putString("colors", sb.toString()).apply();
              }

              static void add(Context c, int col) {
                  col |= 0xFF000000;
                  List<Integer> l = load(c);
                  l.remove(Integer.valueOf(col));
                  l.add(0, col);
                  while (l.size() > 40) l.remove(l.size() - 1);
                  save(c, l);
              }

              static void remove(Context c, int col) {
                  List<Integer> l = load(c);
                  l.remove(Integer.valueOf(col));
                  save(c, l);
              }

              static String hex(int col) {
                  return String.format(Locale.US, "#%06X", col & 0xFFFFFF);
              }

              static void copy(Context c, int col) {
                  ClipboardManager cm = c.getSystemService(ClipboardManager.class);
                  if (cm != null) cm.setPrimaryClip(ClipData.newPlainText("color", hex(col).substring(1)));
              }
          }
          EOF
          cat > app/src/main/java/com/trace/overlay/Templates.java <<'EOF'
          package com.trace.overlay;

          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.Path;

          final class Templates {
              static final String[] NAMES = {
                  "🙂 মুখের অনুপাত", "🧸 চিবি চরিত্র", "🧍 শরীরের অনুপাত", "🏙 পারস্পেক্টিভ বক্স",
                  "⭐ তারা", "❤ হার্ট", "🌸 ফুল", "🔲 গ্রিড"
              };

              static Bitmap make(int i) {
                  Bitmap b = Bitmap.createBitmap(1600, 1600, Bitmap.Config.ARGB_8888);
                  Canvas c = new Canvas(b);
                  Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
                  p.setStyle(Paint.Style.STROKE);
                  p.setColor(Color.BLACK);
                  p.setStrokeWidth(12);
                  p.setStrokeCap(Paint.Cap.ROUND);
                  p.setStrokeJoin(Paint.Join.ROUND);
                  Paint g = new Paint(p);
                  g.setStrokeWidth(6);
                  switch (i) {
                      case 0:
                          c.drawOval(350, 200, 1250, 1350, p);
                          c.drawLine(800, 200, 800, 1350, g);
                          c.drawLine(350, 760, 1250, 760, g);
                          c.drawLine(560, 980, 1040, 980, g);
                          c.drawLine(620, 1140, 980, 1140, g);
                          c.drawOval(470, 710, 690, 810, p);
                          c.drawOval(910, 710, 1130, 810, p);
                          break;
                      case 1:
                          c.drawCircle(800, 600, 380, p);
                          c.drawLine(420, 640, 1180, 640, g);
                          c.drawLine(800, 220, 800, 980, g);
                          c.drawRoundRect(620, 960, 980, 1360, 80, 80, p);
                          c.drawLine(620, 1040, 500, 1250, p);
                          c.drawLine(980, 1040, 1100, 1250, p);
                          c.drawLine(710, 1360, 700, 1520, p);
                          c.drawLine(890, 1360, 900, 1520, p);
                          break;
                      case 2:
                          for (int k = 0; k <= 8; k++) c.drawLine(450, 60 + 190 * k, 1150, 60 + 190 * k, g);
                          c.drawOval(720, 60, 880, 250, p);
                          c.drawLine(800, 250, 800, 900, p);
                          c.drawLine(560, 330, 1040, 330, p);
                          c.drawLine(650, 900, 950, 900, p);
                          c.drawLine(560, 330, 650, 900, p);
                          c.drawLine(1040, 330, 950, 900, p);
                          c.drawLine(560, 330, 500, 1000, p);
                          c.drawLine(1040, 330, 1100, 1000, p);
                          c.drawLine(650, 900, 700, 1540, p);
                          c.drawLine(950, 900, 900, 1540, p);
                          break;
                      case 3:
                          c.drawLine(0, 700, 1600, 700, g);
                          c.drawCircle(800, 700, 14, p);
                          c.drawLine(800, 700, 0, 0, g);
                          c.drawLine(800, 700, 1600, 0, g);
                          c.drawLine(800, 700, 0, 1600, g);
                          c.drawLine(800, 700, 1600, 1600, g);
                          c.drawRect(500, 900, 1100, 1400, p);
                          c.drawRect(635, 810, 965, 1085, p);
                          c.drawLine(500, 900, 635, 810, p);
                          c.drawLine(1100, 900, 965, 810, p);
                          c.drawLine(500, 1400, 635, 1085, p);
                          c.drawLine(1100, 1400, 965, 1085, p);
                          break;
                      case 4: {
                          Path s = new Path();
                          for (int k = 0; k < 10; k++) {
                              double a = -Math.PI / 2 + k * Math.PI / 5;
                              float r = (k % 2 == 0) ? 650 : 260;
                              float x = (float) (800 + r * Math.cos(a)), y = (float) (840 + r * Math.sin(a));
                              if (k == 0) s.moveTo(x, y); else s.lineTo(x, y);
                          }
                          s.close();
                          c.drawPath(s, p);
                          break;
                      }
                      case 5: {
                          Path h = new Path();
                          h.moveTo(800, 1400);
                          h.cubicTo(200, 950, 250, 300, 800, 580);
                          h.cubicTo(1350, 300, 1400, 950, 800, 1400);
                          c.drawPath(h, p);
                          break;
                      }
                      case 6:
                          for (int k = 0; k < 6; k++) {
                              c.save();
                              c.rotate(60 * k, 800, 800);
                              c.drawOval(720, 380, 880, 690, p);
                              c.restore();
                          }
                          c.drawCircle(800, 800, 120, p);
                          c.drawLine(800, 920, 800, 1560, p);
                          c.save();
                          c.rotate(-35, 800, 1250);
                          c.drawOval(800, 1180, 1050, 1320, p);
                          c.restore();
                          break;
                      default:
                          c.drawRect(100, 100, 1500, 1500, p);
                          for (int k = 1; k < 8; k++) {
                              float v = 100 + 175 * k;
                              c.drawLine(v, 100, v, 1500, g);
                              c.drawLine(100, v, 1500, v, g);
                          }
                          break;
                  }
                  return b;
              }
