              String ask(int prov, String key, String model, String baseUrl, List<String[]> hist, String img) throws Exception {
                  List<String[]> h = new ArrayList<>(hist.subList(Math.max(0, hist.size() - 12), hist.size()));
                  while (!h.isEmpty() && !h.get(0)[0].equals("user")) h.remove(0);
                  int last = h.size() - 1;
                  if (prov == 0) {
                      JSONArray contents = new JSONArray();
                      for (int i = 0; i < h.size(); i++) {
                          JSONArray parts = new JSONArray();
                          parts.put(new JSONObject().put("text", h.get(i)[1]));
                          if (i == last && img != null) {
                              parts.put(new JSONObject().put("inline_data",
                                      new JSONObject().put("mime_type", "image/jpeg").put("data", img)));
                          }
                          contents.put(new JSONObject()
                                  .put("role", h.get(i)[0].equals("user") ? "user" : "model")
                                  .put("parts", parts));
                      }
                      JSONObject body = new JSONObject()
                              .put("systemInstruction", new JSONObject().put("parts",
                                      new JSONArray().put(new JSONObject().put("text", SYS))))
                              .put("contents", contents);
                      JSONObject r = post("https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent",
                              body, new String[][]{{"x-goog-api-key", key}});
                      JSONArray parts = r.getJSONArray("candidates").getJSONObject(0)
                              .getJSONObject("content").getJSONArray("parts");
                      StringBuilder sb = new StringBuilder();
                      for (int i = 0; i < parts.length(); i++) {
                          JSONObject p = parts.getJSONObject(i);
                          if (p.has("text") && !p.optBoolean("thought")) sb.append(p.getString("text"));
                      }
                      return sb.toString();
                  } else if (prov == 1) {
                      JSONArray msgs = new JSONArray();
                      msgs.put(new JSONObject().put("role", "system").put("content", SYS));
                      for (int i = 0; i < h.size(); i++) {
                          String role = h.get(i)[0].equals("user") ? "user" : "assistant";
                          if (i == last && img != null) {
                              JSONArray c = new JSONArray()
                                      .put(new JSONObject().put("type", "text").put("text", h.get(i)[1]))
                                      .put(new JSONObject().put("type", "image_url").put("image_url",
                                              new JSONObject().put("url", "data:image/jpeg;base64," + img)));
                              msgs.put(new JSONObject().put("role", role).put("content", c));
                          } else {
                              msgs.put(new JSONObject().put("role", role).put("content", h.get(i)[1]));
                          }
                      }
                      String u = baseUrl.trim();
                      while (u.endsWith("/")) u = u.substring(0, u.length() - 1);
                      JSONObject r = post(u + "/chat/completions",
                              new JSONObject().put("model", model).put("messages", msgs),
                              new String[][]{{"Authorization", "Bearer " + key}});
                      return r.getJSONArray("choices").getJSONObject(0).getJSONObject("message").getString("content");
                  } else {
                      JSONArray msgs = new JSONArray();
                      for (int i = 0; i < h.size(); i++) {
                          String role = h.get(i)[0].equals("user") ? "user" : "assistant";
                          if (i == last && img != null) {
                              JSONArray c = new JSONArray()
                                      .put(new JSONObject().put("type", "image").put("source", new JSONObject()
                                              .put("type", "base64").put("media_type", "image/jpeg").put("data", img)))
                                      .put(new JSONObject().put("type", "text").put("text", h.get(i)[1]));
                              msgs.put(new JSONObject().put("role", role).put("content", c));
                          } else {
                              msgs.put(new JSONObject().put("role", role).put("content", h.get(i)[1]));
                          }
                      }
                      JSONObject body = new JSONObject().put("model", model).put("max_tokens", 1500)
                              .put("system", SYS).put("messages", msgs);
                      JSONObject r = post("https://api.anthropic.com/v1/messages", body,
                              new String[][]{{"x-api-key", key}, {"anthropic-version", "2023-06-01"}});
                      JSONArray c = r.getJSONArray("content");
                      StringBuilder sb = new StringBuilder();
                      for (int i = 0; i < c.length(); i++) {
                          JSONObject p = c.getJSONObject(i);
                          if ("text".equals(p.optString("type"))) sb.append(p.optString("text"));
                      }
                      return sb.toString();
                  }
              }

              JSONObject post(String url, JSONObject body, String[][] headers) throws Exception {
                  HttpURLConnection c = (HttpURLConnection) new URL(url).openConnection();
                  c.setRequestMethod("POST");
                  c.setConnectTimeout(20000);
                  c.setReadTimeout(90000);
                  c.setDoOutput(true);
                  c.setRequestProperty("Content-Type", "application/json");
                  for (String[] hh : headers) c.setRequestProperty(hh[0], hh[1]);
                  try (OutputStream o = c.getOutputStream()) {
                      o.write(body.toString().getBytes(StandardCharsets.UTF_8));
                  }
                  int code = c.getResponseCode();
                  InputStream is = (code >= 200 && code < 300) ? c.getInputStream() : c.getErrorStream();
                  String s = read(is);
                  c.disconnect();
                  if (code < 200 || code >= 300) throw new Exception("HTTP " + code + " — " + shortErr(s));
                  return new JSONObject(s);
              }

              String read(InputStream is) throws Exception {
                  if (is == null) return "";
                  StringBuilder sb = new StringBuilder();
                  try (BufferedReader br = new BufferedReader(new InputStreamReader(is, StandardCharsets.UTF_8))) {
                      String line;
                      while ((line = br.readLine()) != null) sb.append(line).append('\n');
                  }
                  return sb.toString();
              }

              String shortErr(String s) {
                  try {
                      JSONObject j = new JSONObject(s);
                      Object e = j.opt("error");
                      if (e instanceof JSONObject) return ((JSONObject) e).optString("message", s);
                      if (e != null) return e.toString();
                  } catch (Exception ignored) { }
                  return s.length() > 200 ? s.substring(0, 200) : s;
              }

              File currentFile() {
                  int p = getSharedPreferences("state", MODE_PRIVATE).getInt("page", -1);
                  if (p < 0) return null;
                  File f = new File(getFilesDir(), "page_" + p + "_color.png");
                  return f.exists() ? f : null;
              }

              String currentImage() {
                  File f = currentFile();
                  if (f == null) return null;
                  BitmapFactory.Options o = new BitmapFactory.Options();
                  o.inJustDecodeBounds = true;
                  BitmapFactory.decodeFile(f.getAbsolutePath(), o);
                  int s = 1;
                  while (Math.max(o.outWidth, o.outHeight) / s > 1024) s *= 2;
                  BitmapFactory.Options o2 = new BitmapFactory.Options();
                  o2.inSampleSize = s;
                  Bitmap b = BitmapFactory.decodeFile(f.getAbsolutePath(), o2);
                  if (b == null) return null;
                  Bitmap out = Bitmap.createBitmap(b.getWidth(), b.getHeight(), Bitmap.Config.ARGB_8888);
                  Canvas cv = new Canvas(out);
                  cv.drawColor(Color.WHITE);
                  cv.drawBitmap(b, 0, 0, null);
                  ByteArrayOutputStream bo = new ByteArrayOutputStream();
                  out.compress(Bitmap.CompressFormat.JPEG, 85, bo);
                  return Base64.encodeToString(bo.toByteArray(), Base64.NO_WRAP);
              }

              void voice() {
                  Intent i = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                  i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                  i.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "bn-BD");
