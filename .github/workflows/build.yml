                          if (i == last && img != null) {
                              JSONArray c = new JSONArray()
                                      .put(new JSONObject().put("type", "image").put("source", new JSONObject()
                                              .put("type", "base64").put("media_type", "image/jpeg").put("data", img)))
                                      .put(new JSONObject().put("type", "text").put("text", h.get(i)[1]));
                              msgs.put(new JSONObject().put("role", role).put("content", c));
                          } else {
                              msgs.put(new JSONObject().put("role", role).put("content", h.get(i)[1]));
