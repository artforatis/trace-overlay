                      JSONObject body = new JSONObject()
                              .put("systemInstruction", new JSONObject().put("parts",
                                      new JSONArray().put(new JSONObject().put("text", SYS))))
                              .put("contents", contents);
                      JSONObject r = post("https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent",
                              body, new String[][]{{"x-goog-api-key", key}});
                      JSONArray parts = r.getJSONArray("candidates").getJSONObject(0)
                              .getJSONObject("content").getJSONArray("parts");
                      StringBuilder sb = new StringBuilder();
                      for (int i = 0; i < parts.length(); i++) {
                          JSONObject p = parts.getJSONObject(i);
                          if (p.has("text") && !p.optBoolean("thought")) sb.append(p.getString("text"));
                      }
                      return sb.toString();
                  } else if (prov == 1) {
                      JSONArray msgs = new JSONArray();
                      msgs.put(new JSONObject().put("role", "system").put("content", SYS));
