                      }
                      JSONObject body = new JSONObject().put("model", model).put("max_tokens", 1500)
                              .put("system", SYS).put("messages", msgs);
                      JSONObject r = post("https://api.anthropic.com/v1/messages", body,
                              new String[][]{{"x-api-key", key}, {"anthropic-version", "2023-06-01"}});
                      JSONArray c = r.getJSONArray("content");
                      StringBuilder sb = new StringBuilder();
                      for (int i = 0; i < c.length(); i++) {
                          JSONObject p = c.getJSONObject(i);
                          if ("text".equals(p.optString("type"))) sb.append(p.optString("text"));
                      }
                      return sb.toString();
                  }
              }

              JSONObject post(String url, JSONObject body, String[][] headers) throws Exception {
                  HttpURLConnection c = (HttpURLConnection) new URL(url).openConnection();
                  c.setRequestMethod("POST");
                  c.setConnectTimeout(20000);
                  c.setReadTimeout(90000);
                  c.setDoOutput(true);
                  c.setRequestProperty("Content-Type", "application/json");
                  for (String[] hh : headers) c.setRequestProperty(hh[0], hh[1]);
                  try (OutputStream o = c.getOutputStream()) {
                      o.write(body.toString().getBytes(StandardCharsets.UTF_8));
                  }
                  int code = c.getResponseCode();
                  InputStream is = (code >= 200 && code < 300) ? c.getInputStream() : c.getErrorStream();
                  String s = read(is);
                  c.disconnect();
                  if (code < 200 || code >= 300) throw new Exception("HTTP " + code + " — " + shortErr(s));
                  return new JSONObject(s);
              }

              String read(InputStream is) throws Exception {
                  if (is == null) return "";
                  StringBuilder sb = new StringBuilder();
                  try (BufferedReader br = new BufferedReader(new InputStreamReader(is, StandardCharsets.UTF_8))) {
                      String line;
                      while ((line = br.readLine()) != null) sb.append(line).append('\n');
                  }
                  return sb.toString();
              }

              String shortErr(String s) {
                  try {
                      JSONObject j = new JSONObject(s);
                      Object e = j.opt("error");
                      if (e instanceof JSONObject) return ((JSONObject) e).optString("message", s);
                      if (e != null) return e.toString();
                  } catch (Exception ignored) { }
                  return s.length() > 200 ? s.substring(0, 200) : s;
              }

