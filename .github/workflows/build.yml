                      float[] p = {e.getRawX() - loc[0], e.getRawY() - loc[1]};
                      inv.mapPoints(p);
                      int x = Math.round(p[0]), y = Math.round(p[1]);
                      int col = (x >= 0 && y >= 0 && x < bmp.getWidth() && y < bmp.getHeight()) ? bmp.getPixel(x, y) : 0;
                      boolean ok = (col >>> 24) > 100;
                      if (ok) {
                          int r = (col >> 16) & 255, g = (col >> 8) & 255, b = col & 255;
                          prevChip.setVisibility(View.VISIBLE);
                          prevChip.setText(Palette.hex(col));
                          prevChip.setTextColor((r * 299 + g * 587 + b * 114) / 1000 > 140 ? Color.BLACK : Color.WHITE);
                          prevChip.setBackground(ImageTools.round(col | 0xFF000000, dp(26)));
                      }
                      if (e.getActionMasked() == MotionEvent.ACTION_UP) {
                          if (ok) {
                              Palette.add(this, col);
                              toast("✅ " + Palette.hex(col) + " প্যালেটে সেভ হয়েছে");
                              closePicker(true);
                              palOpen = true;
                              palBody.setVisibility(View.VISIBLE);
                              refreshPalette();
                          } else {
                              toast("এখানে কোনো রং নেই — অন্য জায়গায় ট্যাপ করুন");
                          }
                      }
                      return true;
                  });
                  picker = f;
                  wm.addView(f, fullLp(0));
              }

              void closePicker(boolean restore) {
                  if (picker != null) {
                      try { wm.removeView(picker); } catch (Exception ignored) { }
                      picker = null;
                  }
                  if (restore) hideAll(false);
              }

              void requestCapture() {
                  hideAll(true);
                  try {
                      Intent i = new Intent(this, CaptureActivity.class);
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(i);
                  } catch (Exception e) {
                      hideAll(false);
                      toast("স্ক্রিন থেকে রং নেওয়া যায়নি");
                  }
              }

              void handleCapture(int code, Intent data) {
                  if (code != Activity.RESULT_OK || data == null) {
                      hideAll(false);
                      toast("বাতিল করা হয়েছে");
                      return;
                  }
                  try {
                      startForeground(1, notif(), ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE
                              | ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION);
                      MediaProjectionManager mpm = getSystemService(MediaProjectionManager.class);
                      final MediaProjection mp = mpm.getMediaProjection(code, data);
                      if (mp == null) { captureFailed(null, null, null); return; }
                      final Handler hd = new Handler(Looper.getMainLooper());
                      mp.registerCallback(new MediaProjection.Callback() { }, hd);
                      Rect bnd = wm.getCurrentWindowMetrics().getBounds();
                      final int w = bnd.width(), h = bnd.height();
                      final int dpi = getResources().getDisplayMetrics().densityDpi;
                      final ImageReader ir = ImageReader.newInstance(w, h, PixelFormat.RGBA_8888, 3);
                      hd.postDelayed(() -> {
                          try {
                              VirtualDisplay vd = mp.createVirtualDisplay("trace-pick", w, h, dpi,
                                      DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, ir.getSurface(), null, hd);
                              grab(mp, vd, ir, w, h, hd, 0);
                          } catch (Exception e) {
                              captureFailed(mp, null, ir);
                          }
                      }, 300);
                  } catch (Exception e) {
                      captureFailed(null, null, null);
                  }
              }

              void grab(MediaProjection mp, VirtualDisplay vd, ImageReader ir, int w, int h, Handler hd, int tries) {
                  hd.postDelayed(() -> {
                      Image im = null;
                      try { im = ir.acquireLatestImage(); } catch (Exception ignored) { }
                      if (im == null) {
                          if (tries < 10) grab(mp, vd, ir, w, h, hd, tries + 1);
                          else captureFailed(mp, vd, ir);
                          return;
                      }
                      Bitmap bmp = null;
                      try {
                          Image.Plane pl = im.getPlanes()[0];
                          ByteBuffer buf = pl.getBuffer();
                          int ps = pl.getPixelStride(), rs = pl.getRowStride();
                          Bitmap tmp = Bitmap.createBitmap(rs / ps, h, Bitmap.Config.ARGB_8888);
                          tmp.copyPixelsFromBuffer(buf);
                          bmp = Bitmap.createBitmap(tmp, 0, 0, w, h);
                      } catch (Exception ignored) {
                      } finally {
                          im.close();
                      }
                      stopCapture(mp, vd, ir);
                      if (bmp == null) {
                          hideAll(false);
                          toast("স্ক্রিন থেকে রং নেওয়া যায়নি");
                          return;
                      }
                      showPicker(bmp, new Matrix());
                  }, tries == 0 ? 400 : 200);
              }

              void stopCapture(MediaProjection mp, VirtualDisplay vd, ImageReader ir) {
                  try { if (vd != null) vd.release(); } catch (Exception ignored) { }
                  try { if (ir != null) ir.close(); } catch (Exception ignored) { }
                  try { if (mp != null) mp.stop(); } catch (Exception ignored) { }
                  try { startFg(); } catch (Exception ignored) { }
              }

              void captureFailed(MediaProjection mp, VirtualDisplay vd, ImageReader ir) {
                  stopCapture(mp, vd, ir);
                  hideAll(false);
                  toast("স্ক্রিন থেকে রং নেওয়া যায়নি");
              }

              void updatePanelTexts() {
                  pageTv.setText(pageCount > 0 ? (page + 1) + "/" + pageCount : "0/0");
                  modeBtn.setText(showLine ? "⚫ আউটলাইন" : "🎨 রঙিন");
                  magnetBtn.setText(magnetOn ? "🧲 ম্যাগনেট: চালু" : "🧲 ম্যাগনেট: বন্ধ");
                  magnetBtn.setBackground(ImageTools.round(magnetOn ? BLUE : GREY, dp(22)));
              }

              void updateLockUi(boolean showToast) {
                  applyFlags();
                  wm.updateViewLayout(img, imgLp);
                  int col = locked ? RED : GREEN;
                  lockBtn.setText(locked ? "🔒 লক · আঁকুন" : "🔓 আনলক · সাজান");
                  lockBtn.setBackground(ImageTools.round(col, dp(22)));
                  handle.setBackground(ImageTools.round(col, dp(22)));
                  if (locked && frameShown) {
                      wm.removeView(frame);
                      frameShown = false;
                  } else if (!locked && !frameShown) {
                      wm.addView(frame, frameLp);
                      frameShown = true;
                  }
                  if (showToast) toast(locked ? "🔒 লক হয়েছে — এখন আঁকুন" : "🔓 আনলক — ছবি সাজান");
                  updateMagnetLayer();
              }

              void toggleMagnet() {
                  if (!magnetOn && DrawService.instance == null) {
                      Toast.makeText(this, "Accessibility-তে \"Trace Overlay ম্যাগনেট কলম\" চালু করুন", Toast.LENGTH_LONG).show();
                      try {
                          Intent i = new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS);
                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(i);
                      } catch (Exception ignored) { }
                      return;
                  }
                  magnetOn = !magnetOn;
                  updatePanelTexts();
                  updateMagnetLayer();
                  if (magnetOn) toast(locked ? "🧲 চালু — কালো লাইনের উপর দিয়ে আঁকুন" : "🧲 চালু — এবার 🔒 লক করুন");
                  else toast("🧲 ম্যাগনেট বন্ধ");
              }

              void updateMagnetLayer() {
                  boolean want = magnetOn && locked && !drawing && mask != null;
                  try {
                      if (want && !layerShown) {
                          wm.addView(layer, layerLp);
                          layerShown = true;
                          wm.removeView(palRoot);
                          wm.addView(palRoot, palLp);
                          wm.removeView(panel);
                          wm.addView(panel, panelLp);
                      } else if (!want && layerShown) {
                          wm.removeView(layer);
                          layerShown = false;
                      }
                  } catch (Exception ignored) { }
              }

              boolean onLayerTouch(MotionEvent e) {
                  if (drawing) return true;
                  switch (e.getActionMasked()) {
                      case MotionEvent.ACTION_DOWN:
                          pts.clear();
                          layer.path.reset();
                          layer.path.moveTo(e.getX(), e.getY());
                          pts.add(new float[]{e.getRawX(), e.getRawY()});
                          break;
                      case MotionEvent.ACTION_MOVE:
                          if (e.getPointerCount() > 1) break;
                          float offX = e.getRawX() - e.getX(), offY = e.getRawY() - e.getY();
                          for (int h = 0; h < e.getHistorySize(); h++) {
                              float x = e.getHistoricalX(h), y = e.getHistoricalY(h);
                              layer.path.lineTo(x, y);
                              pts.add(new float[]{x + offX, y + offY});
                          }
                          layer.path.lineTo(e.getX(), e.getY());
                          pts.add(new float[]{e.getRawX(), e.getRawY()});
                          layer.invalidate();
                          break;
                      case MotionEvent.ACTION_UP:
                          finishStroke();
                          break;
                      case MotionEvent.ACTION_CANCEL:
                          pts.clear();
                          layer.path.reset();
                          layer.invalidate();
                          break;
                  }
                  return true;
              }

              void finishStroke() {
                  List<Path> strokes = new ArrayList<>();
                  List<Long> durs = new ArrayList<>();
                  snap(pts, strokes, durs);
                  pts.clear();
                  layer.path.reset();
                  layer.invalidate();
                  if (strokes.isEmpty()) {
                      toast("কালো লাইনের আরও কাছ দিয়ে আঁকুন");
                      return;
                  }
                  final DrawService ds = DrawService.instance;
                  if (ds == null) {
                      toast("Accessibility বন্ধ হয়ে গেছে");
                      magnetOn = false;
                      updatePanelTexts();
                      updateMagnetLayer();
                      return;
                  }
                  drawing = true;
                  updateMagnetLayer();
                  img.postDelayed(() -> ds.play(strokes, durs, 0, () -> {
                      drawing = false;
                      updateMagnetLayer();
                  }), 80);
              }

              // Follows the centre of the black outline between points near the pen stroke
              void snap(List<float[]> in, List<Path> out, List<Long> durs) {
                  boolean[] sk = skel != null ? skel : mask;
                  if (sk == null || in.size() < 2) return;
                  Matrix inv = new Matrix();
                  if (!m.invert(inv)) return;
                  int[] loc = new int[2];
                  img.getLocationOnScreen(loc);
                  float[] v = new float[9];
                  m.getValues(v);
                  float scale = (float) Math.hypot(v[Matrix.MSCALE_X], v[Matrix.MSKEW_Y]);
                  if (scale <= 0) return;
                  int rb = Math.max(3, Math.min(120, Math.round(dp(22) / scale)));
                  List<float[]> bp = new ArrayList<>();
                  for (float[] s : in) {
                      float[] p = {s[0] - loc[0], s[1] - loc[1]};
                      inv.mapPoints(p);
                      bp.add(p);
                  }
                  float step = Math.max(2f, rb / 2f);
                  List<float[]> anchors = new ArrayList<>();
                  anchors.add(bp.get(0));
                  float acc = 0;
                  for (int i = 1; i < bp.size(); i++) {
                      acc += (float) Math.hypot(bp.get(i)[0] - bp.get(i - 1)[0], bp.get(i)[1] - bp.get(i - 1)[1]);
                      if (acc >= step || i == bp.size() - 1) {
                          anchors.add(bp.get(i));
                          acc = 0;
                      }
                  }
                  List<Integer> seq = new ArrayList<>();
                  int prevS = -1;
                  for (float[] a : anchors) {
                      int s = nearest(sk, a[0], a[1], rb);
                      if (s < 0) {
                          flush(seq, out, durs, loc);
                          seq = new ArrayList<>();
                          prevS = -1;
                          continue;
                      }
                      if (prevS < 0) {
                          seq.add(s);
                          prevS = s;
                          continue;
                      }
                      if (s == prevS) continue;
                      List<Integer> path = bfs(sk, prevS, s, rb);
                      if (path == null) {
                          flush(seq, out, durs, loc);
                          seq = new ArrayList<>();
                          seq.add(s);
                      } else {
                          for (int k = 1; k < path.size(); k++) seq.add(path.get(k));
                      }
                      prevS = s;
                  }
                  flush(seq, out, durs, loc);
              }

              int nearest(boolean[] sk, float fx, float fy, int rb) {
                  int bx = Math.round(fx), by = Math.round(fy);
                  int best = -1, bestD = rb * rb + 1;
                  for (int dy = -rb; dy <= rb; dy++) {
                      int y = by + dy;
                      if (y < 0 || y >= maskH) continue;
                      int rowStart = y * maskW;
                      for (int dx = -rb; dx <= rb; dx++) {
                          int x = bx + dx;
                          if (x < 0 || x >= maskW) continue;
                          int dd = dx * dx + dy * dy;
                          if (dd < bestD && sk[rowStart + x]) {
                              bestD = dd;
                              best = rowStart + x;
                          }
                      }
                  }
                  return best;
              }

              List<Integer> bfs(boolean[] sk, int a, int b, int rb) {
                  int ax = a % maskW, ay = a / maskW, bx = b % maskW, by = b / maskW;
                  int x0 = Math.max(0, Math.min(ax, bx) - rb), y0 = Math.max(0, Math.min(ay, by) - rb);
                  int x1 = Math.min(maskW - 1, Math.max(ax, bx) + rb), y1 = Math.min(maskH - 1, Math.max(ay, by) + rb);
                  int bw = x1 - x0 + 1, bh = y1 - y0 + 1;
                  if ((long) bw * bh > 2_000_000L) return null;
                  int[] par = new int[bw * bh];
                  Arrays.fill(par, -1);
                  int[] q = new int[bw * bh];
                  int head = 0, tail = 0;
                  int la = (ay - y0) * bw + (ax - x0), lb = (by - y0) * bw + (bx - x0);
                  par[la] = la;
                  q[tail++] = la;
                  boolean found = false;
                  while (head < tail) {
                      int li = q[head++];
                      if (li == lb) { found = true; break; }
                      int lx = li % bw, ly = li / bw;
                      for (int dy = -1; dy <= 1; dy++) {
                          for (int dx = -1; dx <= 1; dx++) {
                              if (dx == 0 && dy == 0) continue;
                              int nx = lx + dx, ny = ly + dy;
                              if (nx < 0 || ny < 0 || nx >= bw || ny >= bh) continue;
                              int nl = ny * bw + nx;
                              if (par[nl] != -1) continue;
                              if (!sk[(ny + y0) * maskW + (nx + x0)]) continue;
                              par[nl] = li;
                              q[tail++] = nl;
                          }
                      }
                  }
                  if (!found) return null;
                  List<Integer> path = new ArrayList<>();
                  int c = lb;
                  while (true) {
                      path.add((c / bw + y0) * maskW + (c % bw + x0));
                      if (c == la) break;
                      c = par[c];
                  }
                  Collections.reverse(path);
                  double direct = Math.hypot(ax - bx, ay - by);
                  if (path.size() > direct * 3 + rb * 2) return null;
                  return path;
              }

              void flush(List<Integer> seq, List<Path> out, List<Long> durs, int[] loc) {
                  if (seq.size() < 2) return;
                  List<float[]> sp = new ArrayList<>();
                  for (int k = 0; k < seq.size(); k++) {
                      if (k % 2 != 0 && k != seq.size() - 1) continue;
                      int idx = seq.get(k);
                      float[] q = {idx % maskW + 0.5f, idx / maskW + 0.5f};
                      m.mapPoints(q);
                      q[0] += loc[0];
                      q[1] += loc[1];
                      sp.add(q);
                  }
                  addStroke(sp, out, durs);
              }

              void addStroke(List<float[]> s, List<Path> out, List<Long> durs) {
                  if (s.size() < 2) return;
                  Path path = new Path();
                  float len = 0, px = 0, py = 0;
                  for (int i = 0; i < s.size(); i++) {
                      int a = Math.max(0, i - 2), b = Math.min(s.size() - 1, i + 2);
                      float sx = 0, sy = 0;
                      for (int j = a; j <= b; j++) { sx += s.get(j)[0]; sy += s.get(j)[1]; }
                      int n = b - a + 1;
                      float x = Math.max(0, sx / n), y = Math.max(0, sy / n);
                      if (i == 0) {
                          path.moveTo(x, y);
                      } else {
                          path.lineTo(x, y);
                          len += (float) Math.hypot(x - px, y - py);
                      }
                      px = x;
                      py = y;
                  }
                  if (len < 2) return;
                  durs.add(Math.max(80L, Math.min(20000L, (long) len)));
                  out.add(path);
              }

              void loadPage() {
                  File dir = getFilesDir();
                  Bitmap c = BitmapFactory.decodeFile(new File(dir, "page_" + page + "_color.png").getAbsolutePath());
                  Bitmap l = BitmapFactory.decodeFile(new File(dir, "page_" + page + "_line.png").getAbsolutePath());
                  if (c == null || l == null) {
                      toast("ছবি খোলা যায়নি");
                      return;
                  }
                  colorBmp = c;
                  lineBmp = l;
                  maskW = l.getWidth();
                  maskH = l.getHeight();
                  int[] px = new int[maskW * maskH];
                  l.getPixels(px, 0, maskW, 0, 0, maskW, maskH);
                  final boolean[] mk = new boolean[px.length];
                  for (int i = 0; i < px.length; i++) mk[i] = (px[i] >>> 24) > 100;
                  mask = mk;
                  skel = null;
                  final int token = ++skelToken;
                  final int w = maskW, h = maskH;
                  new Thread(() -> {
                      boolean[] s = ImageTools.skeleton(mk, w, h);
                      img.post(() -> { if (token == skelToken) skel = s; });
                  }).start();
                  imgHidden = false;
                  eyeBtn.setText("👁");
                  img.setImageBitmap(showLine ? lineBmp : colorBmp);
                  img.setVisibility(View.VISIBLE);
                  img.post(this::fitImage);
                  updatePanelTexts();
                  updateMagnetLayer();
                  getSharedPreferences("state", MODE_PRIVATE).edit()
                          .putInt("page", page).putInt("count", pageCount).apply();
              }

              boolean onImgTouch(MotionEvent e) {
                  int n = e.getPointerCount();
                  switch (e.getActionMasked()) {
                      case MotionEvent.ACTION_DOWN:
                          lastX = e.getX(); lastY = e.getY();
                          break;
                      case MotionEvent.ACTION_POINTER_DOWN:
                          prevDist = 0;
                          break;
                      case MotionEvent.ACTION_MOVE:
                          if (n == 1) {
                              m.postTranslate(e.getX() - lastX, e.getY() - lastY);
                              lastX = e.getX(); lastY = e.getY();
                          } else {
                              float dx = e.getX(1) - e.getX(0), dy = e.getY(1) - e.getY(0);
                              float dist = (float) Math.hypot(dx, dy);
                              float ang = (float) Math.toDegrees(Math.atan2(dy, dx));
                              float mx = (e.getX(0) + e.getX(1)) / 2, my = (e.getY(0) + e.getY(1)) / 2;
                              if (prevDist > 0 && dist > 0) {
                                  float da = ang - prevAngle;
                                  if (da > 180) da -= 360;
                                  if (da < -180) da += 360;
                                  m.postTranslate(mx - prevMidX, my - prevMidY);
                                  m.postScale(dist / prevDist, dist / prevDist, mx, my);
                                  m.postRotate(da, mx, my);
                              }
                              prevDist = dist; prevAngle = ang; prevMidX = mx; prevMidY = my;
                          }
                          img.setImageMatrix(m);
                          break;
                      case MotionEvent.ACTION_POINTER_UP:
                          int keep = e.getActionIndex() == 0 ? 1 : 0;
                          lastX = e.getX(keep); lastY = e.getY(keep);
                          prevDist = 0;
                          break;
                  }
                  return true;
              }

              void fitImage() {
                  Drawable dr = img.getDrawable();
                  if (dr == null) return;
                  float vw = img.getWidth(), vh = img.getHeight();
                  float bw = dr.getIntrinsicWidth(), bh = dr.getIntrinsicHeight();
                  if (vw == 0 || vh == 0) { img.postDelayed(this::fitImage, 100); return; }
                  if (bw <= 0 || bh <= 0) return;
                  float s = Math.min(vw / bw, vh / bh);
                  m.reset();
                  m.postScale(s, s);
                  m.postTranslate((vw - bw * s) / 2, (vh - bh * s) / 2);
                  img.setImageMatrix(m);
              }

              @Override
              public void onDestroy() {
                  if (wm != null) {
                      try { wm.removeView(img); } catch (Exception ignored) { }
                      try { wm.removeView(panel); } catch (Exception ignored) { }
                      try { wm.removeView(palRoot); } catch (Exception ignored) { }
                      if (frameShown) try { wm.removeView(frame); } catch (Exception ignored) { }
                      if (layerShown) try { wm.removeView(layer); } catch (Exception ignored) { }
                      closePicker(false);
                  }
                  super.onDestroy();
              }
          }
