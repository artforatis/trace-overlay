name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Create project
        run: |
          mkdir -p app/src/main/java/com/trace/overlay
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "TraceOverlay"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3072m
          android.useAndroidX=true
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.trace.overlay'
              compileSdk 34
              defaultConfig {
                  applicationId "com.trace.overlay"
                  minSdk 30
                  targetSdk 34
                  versionCode 4
                  versionName "4.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1'
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.INTERNET"/>
              <queries>
                  <intent><action android:name="android.intent.action.TTS_SERVICE"/></intent>
                  <intent><action android:name="android.speech.action.RECOGNIZE_SPEECH"/></intent>
              </queries>
              <application
                  android:label="Trace Overlay"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:allowBackup="false"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <meta-data
                      android:name="com.google.mlkit.vision.DEPENDENCIES"
                      android:value="subject_segment"/>
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <activity
                      android:name=".AssistantActivity"
                      android:exported="false"
                      android:theme="@android:style/Theme.Material.Dialog.NoActionBar"
                      android:taskAffinity="com.trace.overlay.ai"
                      android:launchMode="singleTask"
                      android:windowSoftInputMode="adjustResize"/>
                  <activity
                      android:name=".CaptureActivity"
                      android:exported="false"
                      android:theme="@android:style/Theme.Translucent.NoTitleBar"
                      android:taskAffinity="com.trace.overlay.cap"
                      android:excludeFromRecents="true"
                      android:launchMode="singleTask"/>
                  <service
                      android:name=".OverlayService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse|mediaProjection">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Floating tracing reference image"/>
                  </service>
                  <service
                      android:name=".DrawService"
                      android:exported="true"
                      android:label="Trace Overlay ম্যাগনেট কলম"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/draw_service"/>
                  </service>
              </application>
          </manifest>
          EOF
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="acc_desc">ম্যাগনেট কলম: আপনার আঁকা রেখাকে কালো আউটলাইনের উপর বসিয়ে আর্ট অ্যাপে এঁকে দেয়। এটি স্ক্রিনের কোনো লেখা বা তথ্য পড়ে না।</string>
          </resources>
          EOF
          cat > app/src/main/res/xml/draw_service.xml <<'EOF'
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/acc_desc"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="false"
              android:notificationTimeout="100"/>
          EOF
